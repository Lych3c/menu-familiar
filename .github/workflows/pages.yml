name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate menu and component data
        run: node scripts/validate-data.js
      - name: Validate contextual pairings
        run: node scripts/validate-pairings.js
      - name: Validate JavaScript syntax
        run: |
          node --check js/core.js
          node --check js/recipes.js
          node --check js/pantry.js
          node --check js/auto-builder.js
          node --check js/pantry-inventory.js
          node --check js/shopping.js
          node --check js/settings.js
          node --check js/profile-backup.js
          node --check js/weekly-planner.js
          node --check js/weekly-home.js
          node --check js/ai-client.js
          node --check js/v9-ux.js
          node --check js/v9-calendar-observer.js
          node --check js/v10-world.js
          node --check js/v12-library.js
          node --check data/components.js
          node --check data/culinary-extensions.js
          node --check data/component-expansion-v12.js
          node --check data/international-recipes.js
          node --check data/world-expansion-2.js
          node --check data/world-expansion-3.js
          node --check data/provenance.js
          node --check scripts/validate-pairings.js
      - name: Verify required offline assets
        run: |
          test -f v7.css
          test -f v9.css
          test -f v10.css
          test -f v12.css
          test -f js/v9-ux.js
          test -f js/v9-calendar-observer.js
          test -f js/v10-world.js
          test -f js/v12-library.js
          test -f data/international-recipes.js
          test -f data/world-expansion-2.js
          test -f data/world-expansion-3.js
          test -f data/component-expansion-v12.js
          test -f service-worker.js
          grep -q "menu-familiar-v13-0" service-worker.js
          grep -q "js/pantry.js" service-worker.js
          grep -q "js/auto-builder.js" service-worker.js
          grep -q "js/v12-library.js" service-worker.js
          grep -q "data/world-expansion-3.js" service-worker.js
          grep -q "data/component-expansion-v12.js" service-worker.js
          grep -q "v12.css" service-worker.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
