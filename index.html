<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176b52">
  <meta name="description" content="Menú familiar, recetas, despensa y recomendaciones de cocina para Colombia.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Menú Familiar">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="v3.css">
  <link rel="stylesheet" href="auto-builder.css">
  <link rel="stylesheet" href="v7.css">
  <link rel="stylesheet" href="v9.css">
  <title>Menú Familiar</title>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brandrow">
      <div class="brandmark" aria-hidden="true">🍽️</div>
      <div class="grow"><h1>Menú Familiar</h1><div class="sub">Plan · recetas · despensa · compras</div></div>
      <button class="iconbtn" id="themeBtn" aria-label="Cambiar tema">◐</button>
    </div>
  </header>
  <main class="main">
    <section id="home" class="section active" aria-label="Inicio"></section>
    <section id="calendar" class="section" aria-label="Plan familiar"></section>
    <section id="recipes" class="section" aria-label="Recetas y complementos"></section>
    <section id="pantry" class="section" aria-label="Despensa y qué cocinar"></section>
    <section id="shopping" class="section" aria-label="Compras"></section>
    <section id="settings" class="section" aria-label="Ajustes"></section>
  </main>
</div>
<nav class="bottomnav" aria-label="Navegación principal">
  <div class="navinner">
    <button class="navbtn active" data-tab="home"><span>🏠</span><span>Hoy</span></button>
    <button class="navbtn" data-tab="calendar"><span>🗓️</span><span>Plan</span></button>
    <button class="navbtn" data-tab="recipes"><span>📖</span><span>Recetas</span></button>
    <button class="navbtn" data-tab="pantry"><span>🥕</span><span>Despensa</span></button>
    <button class="navbtn" data-tab="shopping"><span>🛒</span><span>Compras</span></button>
  </div>
</nav>
<button id="moreBtn" class="floating-more" aria-label="Abrir ajustes">⚙️</button>
<div class="modal" id="recipeModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="backdrop" data-close-modal></div><div class="sheet"><div class="sheet-inner"><div class="handle"></div><div id="recipeModalBody"></div></div></div></div>
<div class="modal" id="aiModal" role="dialog" aria-modal="true" aria-labelledby="aiModalTitle"><div class="backdrop" data-close-ai></div><div class="sheet"><div class="sheet-inner"><div class="handle"></div><div id="aiModalBody"></div></div></div></div>
<script src="data/base.js"></script>
<script src="data/v3-init.js"></script>
<script src="data/v3-breakfasts.js"></script>
<script src="data/v3-lunches.js"></script>
<script src="data/v3-dinners.js"></script>
<script src="data/components.js"></script>
<script src="data/culinary-extensions.js"></script>
<script src="js/core.js"></script>
<script src="data/v4-library.js"></script>
<script src="data/v4-fixes.js"></script>
<script src="data/provenance.js"></script>
<script src="js/recipes.js"></script>
<script src="js/pantry.js"></script>
<script src="js/auto-builder.js"></script>
<script src="js/pantry-inventory.js"></script>
<script src="js/shopping.js"></script>
<script src="js/settings.js"></script>
<script src="js/profile-backup.js"></script>
<script src="js/weekly-planner.js"></script>
<script src="js/weekly-home.js"></script>
<script src="js/ai-client.js"></script>
<script src="js/v9-ux.js"></script>
</body>
</html>
